# ============================================================================
# Code and reproducibility
# ============================================================================
github_repo: "https://github.com/AvadhootGandhe/India-runs-AI"
# Required. Must be reachable. Private repos OK if you can grant organizer
# access at Stage 3 (the email to add will be communicated then).

sandbox_link: "https://colab.research.google.com/drive/1GD1n1JMYTQH07XhZMzNpx4l21Ip8h-U6?usp=sharing"
# Required. A working hosted environment where the ranker can be run on a small
# candidate sample. See Section 10.5 of submission_spec.md for acceptable
# platforms (HuggingFace Spaces, Streamlit Cloud, Replit, Colab, Docker, Binder).

reproduce_command: "python rank.py --candidates ./candidates.jsonl --retrieval-results ./artifacts/top_1000.csv --flagged ./artifacts/flagged.csv --out ./submission.csv --top-k 1000"
# The single command that produces submission.csv from candidates.jsonl.
# Should run end-to-end within 5 minutes on CPU with 16GB RAM and no network.

# ============================================================================
# Compute environment
# ============================================================================
compute:
  platform: "Local Windows machine"                    # Or: "AWS EC2 c5.4xlarge", "Local Linux box", etc.
  cpu_cores: 6                                  # Number of CPU cores used
  ram_gb: 16                                    # Available RAM in GB
  python_version: "3.12"                      # python --version
  os: "Windows"                              # Or "Ubuntu 22.04 LTS", etc.
  uses_gpu_for_inference: false                 # Must be false — see compute constraints
  has_network_during_ranking: false             # Must be false — no API calls during ranking
  pre_computation_required: true               # true if you pre-compute embeddings or train models offline
  pre_computation_time_minutes: 60-75              # Approximate, if applicable

# ============================================================================
# AI tools declaration
# ============================================================================
# Transparency only — declared use is NOT penalized. Be honest. Stage 5 interview
# may verify these declarations against your code; declarations that contradict
# your code or your interview are flagged.
ai_tools_used:
  - "Claude"        # e.g. for architecture discussion, code review
  - "GitHub Copilot"
  - "OpenAI Codex"  # e.g. for autocomplete
  # Other options: "ChatGPT", "Cursor", "Gemini", "Codeium", "Other", "None"

ai_usage_summary: |
  Used AI coding assistance for README/documentation cleanup, command validation,
  debugging dependency/environment issues, and making a minimal code fixes.
  No external API calls are made during ranking.

# ============================================================================
# Approach summary (optional but recommended)
# ============================================================================
methodology_summary: |
  "The solution uses a retrieval-gated ranking pipeline. Candidate profiles are
  converted into structured text and embedded with intfloat/e5-small-v2 on CPU.
  FAISS semantic search narrows the full candidate set to artifacts/top_1000.csv.
  A separate anomaly detector flags contradictory or suspicious profiles such as
  impossible skill durations, inverted salary ranges, overlapping roles, and
  years-of-experience mismatches. The final ranker loads only candidate IDs from
  the retrieved top-1000 pool, joins them back to full profile data from
  candidates.jsonl, removes HONEYPOT profiles, extracts domain features for AI,
  retrieval, vector DB, LLM/NLP, ranking/IR, experience, location, behavioral
  signals, education, and product/consulting fit, then reranks with a LightGBM
  LambdaRank model trained on pseudo-labels from rule-based domain scores. SHAP
  values are used to generate concise reasoning for each selected candidate."

# ============================================================================
# Declarations
# ============================================================================
declarations:
  read_submission_spec: true        # I have read submission_spec.md in full
  code_is_original_work: true       # My code is my team's original work (using AI as a tool is fine)
  no_collusion: true                # I have not coordinated my submission with other teams
  honeypot_check_done: true        # OPTIONAL — set true if you explicitly checked for honeypots in your ranking
  reproduction_tested: true         # I have tested that my reproduce_command runs end-to-end
